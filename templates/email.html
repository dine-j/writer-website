<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Chloe Mandel — Dark Epic Fantasy</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap');

    body, table, td, p, a, li, blockquote {
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    }
    table, td {
      mso-table-lspace: 0pt;
      mso-table-rspace: 0pt;
    }
    img {
      border: 0;
      outline: none;
      text-decoration: none;
      -ms-interpolation-mode: bicubic;
    }
    a { color: inherit; }

    /* Styling for the broadcast/sequence content Kit inserts via {{ message_content }} */
    .email-body h1, .email-body h2, .email-body h3 {
      font-family: 'Cinzel', 'Palatino Linotype', serif;
      font-weight: 400;
      color: #F1ECE4;
      margin: 0 0 24px;
    }
    .email-body p {
      margin: 0 0 18px;
      line-height: 1.8;
    }
    .email-body a {
      color: #c0314a;
      text-decoration: underline;
    }
    .email-body em, .email-body strong {
      color: #F1ECE4;
    }
    .email-body blockquote {
      margin: 0 0 18px;
      padding-left: 16px;
      border-left: 3px solid #8a1d2d;
      font-style: italic;
      color: #7a6f65;
    }
  </style>
</head>

<!--
  KIT TEMPLATE — this is a reusable template applied to broadcasts/sequences.
  The welcome copy (eyebrow, headline, body, signature) lives in the Kit
  message editor, not in this file — it's inserted via {{ message_content }}.

  Merge tags used below:
    {{ message_content }}            body written per broadcast/sequence
    {{ address }}                     your Kit account's mailing address (compliance)
    {{ unsubscribe_url }}             unsubscribe URL (custom link text)
    {{ subscriber_preferences_url }}  preferences URL (custom link text)
-->

<body style="margin:0;padding:0;background-color:#080610;">

  <!-- Outer wrapper -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
         bgcolor="#080610" style="background-color:#080610;">
    <tr>
      <td align="center" style="padding:40px 16px;">

        <!-- Card -->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
               style="max-width:580px;">

          <!-- ── HEADER ── -->
          <!-- Top burgundy bar -->
          <tr>
            <td bgcolor="#8a1d2d" height="3"
                style="background-color:#8a1d2d;font-size:1px;line-height:1px;">&nbsp;</td>
          </tr>

          <tr>
            <td align="center" bgcolor="#0e0c18"
                style="background-color:#0e0c18;padding:36px 40px 28px;">

              <p style="margin:0 0 8px;
                         font-family:'Cinzel','Palatino Linotype',serif;
                         font-size:10px;
                         letter-spacing:0.25em;
                         text-transform:uppercase;
                         color:#c9a53f;">
                Dark Epic Fantasy
              </p>

              <h1 style="margin:0;
                          font-family:'Cinzel','Palatino Linotype',serif;
                          font-size:26px;
                          font-weight:400;
                          letter-spacing:0.1em;
                          color:#F1ECE4;">
                Chloe Mandel
              </h1>

            </td>
          </tr>

          <!-- Burgundy rule under header -->
          <tr>
            <td bgcolor="#0e0c18" style="background-color:#0e0c18;padding:0 40px 0;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="border-top:1px solid #8a1d2d;">&nbsp;</td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- ── BODY ── -->
          <tr>
            <td align="left" bgcolor="#1a1520" class="email-body"
                style="background-color:#1a1520;padding:36px 40px 40px;
                       font-family:Georgia,'Times New Roman',serif;
                       font-size:16px;
                       color:#C4B8AC;
                       line-height:1.8;">

              {{ message_content }}

              <p style="margin:0 0 4px;">
                Yours beyond the mists,
              </p>
              <p style="margin:0 0 4px;
                         font-family:'Cinzel','Palatino Linotype',serif;
                         font-size:16px;">
                Chloe
              </p>
            </td>

            
          </tr>

          <!-- ── QUOTE BAND ── -->
          <tr>
            <td bgcolor="#0e0c18"
                style="background-color:#0e0c18;
                       padding:28px 40px 28px 38px;
                       border-left:0;
                       border-top:1px solid #1e2028;
                       border-bottom:1px solid #1e2028;">
              <!-- Burgundy left border simulated with a nested table -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td width="3" bgcolor="#8a1d2d"
                      style="background-color:#8a1d2d;font-size:1px;">&nbsp;</td>
                  <td style="padding-left:16px;">
                    <p style="margin:0;
                               font-family:Georgia,'Times New Roman',serif;
                               font-style:italic;
                               font-size:14px;
                               color:#7a6f65;
                               line-height:1.7;">
                      &ldquo;Oh no luv&rsquo;, no one escapes from Variska.&rdquo;
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- ── FOOTER ── -->
          <tr>
            <td align="center" bgcolor="#080610"
                style="background-color:#080610;padding:24px 40px;">

              <p style="margin:0 0 10px;
                         font-family:Georgia,'Times New Roman',serif;
                         font-size:11px;
                         color:#7a6f65;
                         line-height:1.6;">
                You received this because you signed up at
                <a href="https://chloemandel.com"
                   style="color:#8D8287;text-decoration:underline;">chloemandel.com</a>.
              </p>

              <p style="margin:0;
                         font-family:Georgia,'Times New Roman',serif;
                         font-size:11px;
                         color:#7a6f65;">
                <a href="{{ unsubscribe_url }}"
                   style="color:#8D8287;text-decoration:underline;">
                  Unsubscribe
                </a>
                &nbsp;·&nbsp;
                <a href="{{ subscriber_preferences_url }}"
                   style="color:#8D8287;text-decoration:underline;">
                  Update preferences
                </a>
              </p>

            </td>
          </tr>

          <!-- Bottom burgundy bar -->
          <tr>
            <td bgcolor="#8a1d2d" height="2"
                style="background-color:#8a1d2d;font-size:1px;line-height:1px;">&nbsp;</td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
